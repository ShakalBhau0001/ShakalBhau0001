name: 🐍 Neon Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  build:
    name: 🧩 Build & Deploy Ultra Snake
    runs-on: ubuntu-latest

    if: github.repository == 'ShakalBhau0001/ShakalBhau0001'

    permissions:
      contents: write

    steps:
      - name: 🪶 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚡ Setup Cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-snake-cache-v4

      - name: 🌈 Generate Ultra Neon Snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}

          color_snake: "#00FFF2"
          color_dots: "#FF69B4,#33CC33,#6666CC,#FFD700,#00FFFF,#FF4500,#00112B"

          dots_density: 2.5
          snake_growth_rate: 2.0
          snake_trail_length: 220
          snake_trail_opacity: 0.75
          snake_speed: 1.4
          frame_rate: 60

          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake-light.svg?palette=github-light
            dist/github-contribution-grid-snake-neon.svg?palette=github-dark&color_snake=#00FFF2&color_dots=#FF69B4,#33CC33,#6666CC,#FFD700,#00FFFF,#FF4500

      - name: 🔧 Force Neon Blue Background
        run: |
          echo "🎨 Forcing background color to Neon Blue (#0011FF)..."

          for f in dist/github-contribution-grid-snake*.svg; do
            if [ -f "$f" ]; then
              sed -i 's/fill="[^"]*"/fill="#0011FF"/g' "$f"
            else
              echo "⚠️ File not found: $f"
            fi
          done

      - name: 🚀 Deploy SVGs
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ Confirm Success
        run: |
          echo "🎉 Ultra Neon Snake animation deployed successfully!"
          echo "🐍 Background forced to Neon Blue (#0011FF)"
          echo "🐍 Dots increased, snake grows faster, and trail glows smoother!"
